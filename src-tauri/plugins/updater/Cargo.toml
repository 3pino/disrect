[package]
name = "tauri-plugin-fixplor-updater"
version = "0.1.0"
description = "Android: アプリの更新（APK の取得と、パッケージインストーラーへの受け渡し）"
edition = "2021"
publish = false
links = "tauri-plugin-fixplor-updater"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
# Android には、rustls が読める OS の証明書の置き場所が無い（native-roots は何も見つけず、すべての https が証明書で失敗する）ので、同梱の証明書（Mozilla）も使う
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
