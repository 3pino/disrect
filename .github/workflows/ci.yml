name: CI

on:
  push:
    branches: [main]
  pull_request:

# デバッグ情報を作らない（ビルドとリンクが速くなり、キャッシュも小さくなる）
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Disnans のプラグイン（plugins/fixplor）: 成果物を作り、境界を検査し、作った main.js を本体の偽物の上で動かす
      - run: npm run build:plugin
      - run: npm run check:plugin -- --dist
      - run: npx vitest run plugins/fixplor/src/bundle.test.ts
        env:
          REQUIRE_PLUGIN_BUNDLE: '1'

  # ファイルの操作（Rust）。OS ごとに決まりが違う（区切り・大文字と小文字・リンク・ゴミ箱）ので、Linux と Windows の両方で確かめる
  fs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux の依存ライブラリ
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # tauri のビルドは、画面の成果物（dist）が在ることを確かめる
      - run: mkdir dist
        shell: bash
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
