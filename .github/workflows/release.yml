name: Release

# v で始まるタグを打つと、Linux（deb・AppImage）と Windows（インストーラー）を作って、GitHub のリリースに載せる。
# 手で動かしたとき（workflow_dispatch）は、作るだけ（リリースは作らず、成果物として残す）。
# 署名・自動更新は、まだ入れていない（Windows は未署名なので、SmartScreen の警告が出る）。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # タグ・tauri.conf.json・Cargo.toml・package.json の版が、そろっていること
      - name: 版がそろっているか確かめる
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(jq -r .version src-tauri/tauri.conf.json)
          PKG=$(jq -r .version package.json)
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          for v in "$CONF" "$PKG" "$CARGO"; do
            if [ "$v" != "$TAG" ]; then
              echo "::error::タグ ($TAG) と、設定ファイルの版 (tauri.conf.json=$CONF, package.json=$PKG, Cargo.toml=$CARGO) が違います"; exit 1
            fi
          done

  bundle:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # AppImage を古い glibc の環境でも動かすため、Linux は古めの Ubuntu でビルドする
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux の依存ライブラリ
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: npm ci
      # タグのとき: リリースを作って、配布物を載せる。手動のとき: 作るだけ
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: fixplor ${{ github.ref_name }}
          releaseBody: |
            配布物:
            - Windows: `fixplor_*_x64-setup.exe`（署名していないので、SmartScreen の警告が出ます）
            - Linux: `.deb`（Debian・Ubuntu）、`.AppImage`
          releaseDraft: false
          prerelease: false
      - run: npm run tauri:build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: fixplor-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
